name: q15-exact-polygon-winding
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  exact-polygon-winding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned FLINT (chart generation only)
        run: python -m pip install python-flint==0.9.0
      - name: Generate certified whole-segment boxes
        run: python research/audits/liouville_grothendieck_20261008/generate_q15_contour_charts.py --output /tmp/q15-contour-charts.json
      - name: Verify rational polygon winding without FLINT
        run: python research/audits/liouville_grothendieck_20261008/verify_q15_contour_polygon.py /tmp/q15-contour-charts.json --expect
