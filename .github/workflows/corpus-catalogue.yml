name: Lean corpus source integrity
on:
  push:
    paths: ['corpus/**', '.github/workflows/corpus-catalogue.yml']
  pull_request:
    paths: ['corpus/**', '.github/workflows/corpus-catalogue.yml']
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the five published archive snapshots
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          data = json.loads(Path('corpus/catalogue.json').read_text())
          dest = Path('corpus-downloads')
          dest.mkdir()
          for item in data['archives']:
              request = urllib.request.Request(item['url'], headers={'User-Agent':'CouretCorpusIntegrity/1.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  content = response.read(50 * 1024 * 1024 + 1)
              if len(content) > 50 * 1024 * 1024:
                  raise SystemExit('Archive exceeds the download bound: ' + item['name'])
              (dest / item['name']).write_bytes(content)
          PY
      - name: Check Git snapshots and archive members without executing their sources
        run: python3 corpus/verify_catalogue.py --git-mirror . --archives corpus-downloads
