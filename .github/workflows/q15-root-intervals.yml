name: q15-root-intervals
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  finite-q15-interval-certificate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned ball-arithmetic backend
        run: python -m pip install python-flint==0.9.0
      - name: Replay 37 isolations and finite argument counts (not global GRH or density)
        run: python research/audits/liouville_grothendieck_20261008/certify_q15_root_intervals.py --check
      - name: Refuse wrong roots, insufficient precision, boundary zeros and modified receipts
        run: python research/audits/liouville_grothendieck_20261008/test_q15_root_intervals.py
