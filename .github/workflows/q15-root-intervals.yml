name: zero-intervals-and-tail-bounds
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  finite-67-roots-and-conditional-tail-bounds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned ball-arithmetic backend
        run: python -m pip install python-flint==0.9.0
      - name: Replay 37 isolations and finite argument counts (not global GRH or density)
        run: python research/audits/liouville_grothendieck_20261008/certify_q15_root_intervals.py --check
      - name: Reject unresolved signs, wrong roots, boundary zeros and altered receipts
        run: python research/audits/liouville_grothendieck_20261008/test_q15_root_intervals.py
      - name: Replay thirty q3/q5 isolations and finite counts up to 25
        run: python research/audits/liouville_grothendieck_20261008/certify_q3_q5_root_intervals.py --check
      - name: Recompute at 320 bits and reject wrong labels, bad seeds and reversed-count misuse
        run: python research/audits/liouville_grothendieck_20261008/test_q3_q5_root_intervals.py
      - name: Replay analytic K enclosures independently of ordinate data
        run: python research/audits/liouville_grothendieck_20261008/certify_spectral_constants.py --check
      - name: Verify exact tail aggregation and conditional Gaussian comparison bounds
        run: python research/audits/liouville_grothendieck_20261008/verify_q15_tail_bounds.py --check
      - name: Check signed weights, rational rounding and refusal controls
        run: python research/audits/liouville_grothendieck_20261008/test_q15_tail_bounds.py
      - name: Verify full seven-character Gaussian tail replacement bounds
        run: python research/audits/liouville_grothendieck_20261008/verify_all_tail_bounds.py --check
      - name: Verify full-tail witnesses and reject incomplete or uncertain inputs
        run: python research/audits/liouville_grothendieck_20261008/test_all_tail_bounds.py
      - name: Enclose Q5 conditional sign probability with rational Fourier/Simpson errors
        run: python research/audits/liouville_grothendieck_20261008/certify_q5_probability.py --check
      - name: Reject invalid Q5 inversion parameters and preserve conditional scope
        run: python research/audits/liouville_grothendieck_20261008/test_certify_q5_probability.py
      - name: Audit proposed double-Abel spectral K refinements without replacing pinned K
        run: python research/audits/liouville_grothendieck_20261008/certify_refined_K_20261013.py > /tmp/cu_refined_K.json
