name: G02 STROBO enumeration Lean
on:
  pull_request:
    paths:
      - 'research/strobo-2tors-2026-10-12/lean/**'
      - '.github/workflows/g02-strobo-enumeration-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/strobo-2tors-2026-10-12/lean
          build: true
          use-mathlib-cache: true
      - name: Check enumeration axiom trace and disallow sorry
        working-directory: research/strobo-2tors-2026-10-12/lean
        run: |
          grep -R -n -E '\\bsorry\\b|sorryAx' Strobo2TorsEnumeration.lean && exit 1 || true
          printf 'import Strobo2TorsEnumeration\n#print axioms Couret.STROBO2TORS.pair_sum_translate\n' > G02AxiomCheck.lean
          lake env lean G02AxiomCheck.lean > G02AxiomCheck.log
          cat G02AxiomCheck.log
          ! grep -q 'sorryAx' G02AxiomCheck.log
