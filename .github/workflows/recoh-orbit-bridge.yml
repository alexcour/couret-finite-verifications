name: RECOH Orbit Bridge Lean 4 Reproduction
on:
  push:
    branches:
      - research/recoh-conditional-lean-repro-2026-10-30
  pull_request:
    paths:
      - 'research/strobo-2tors-2026-10-12/lean/RecohConditionalOrbitBridge.lean'
      - '.github/workflows/recoh-orbit-bridge.yml'
permissions:
  contents: read
jobs:
  lean-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/strobo-2tors-2026-10-12/lean
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/strobo-2tors-2026-10-12/lean
          build: false
      - name: Build STROBO prerequisite
        run: lake build Strobo2TorsCardinality
      - name: Compile the exact bridge module
        run: lake env lean RecohConditionalOrbitBridge.lean
      - name: Record source commit
        run: echo "SOURCE_SHA=$GITHUB_SHA"
