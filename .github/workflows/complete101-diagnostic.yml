name: Diagnose complete observation definition closure
on:
  push:
    branches: [palomar/complete101-diagnostic-20261121]
permissions:
  contents: read
jobs:
  encoding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          build: false
          use-mathlib-cache: false
      - name: Compare common definition closure
        shell: bash
        run: |
          lake build ChallengeComplete101 CertificateData
          python3 - <<'PY'
          from pathlib import Path
          body = '''open Lean Elab Command
          set_option pp.all true
          run_cmd do
            let env ← getEnv
            for (name, info) in env.constants.toList do
              if "Couret.".isPrefixOf name.toString then
                if let .defnInfo d := info then
                  let h := match d.hints with | .opaque => "opaque" | .abbrev => "abbrev" | .regular n => toString n
                  logInfo m!"DECL {name} VALUEHASH {d.value.hash} TYPEHASH {d.type.hash} HINTS {h} LEVELS {d.levelParams}"
                  if name.toString == "Couret.instDecidableForallOfDecidablePredCode30" || name.toString == "Couret.Certificate.instDecidableExistsCode30OfDecidablePred" then
                    logInfo m!"VALUE {name} {d.value}"
          '''
          for mod in ['ChallengeComplete101','CertificateData']:
              Path('Closure'+mod+'.lean').write_text('module\npublic import Lean\npublic import '+mod+'\n'+body)
          PY
          echo CHALLENGE_CLOSURE
          lake env lean ClosureChallengeComplete101.lean
          echo SOLUTION_CLOSURE
          lake env lean ClosureCertificateData.lean
