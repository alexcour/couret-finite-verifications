name: RECOH all 2-power cube gate
on:
  push:
    branches: [research/recoh-2power-triple-nonzero-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  algebra:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Reject placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' research/strobo-2tors-2026-10-12/lean/RecohTwoPowerCubeGate.lean; then exit 1; fi
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile both prerequisites and candidate
        working-directory: research/strobo-2tors-2026-10-12/lean
        shell: bash
        run: |
          set -euo pipefail
          lake resolve-deps
          lake exe cache get
          lake build RecohRankBounds RecohTwoPowerCoprimeGate
          lake env lean RecohTwoPowerCubeGate.lean | tee /tmp/recoh-two-power-cube.log
          if grep -q sorryAx /tmp/recoh-two-power-cube.log; then exit 1; fi
