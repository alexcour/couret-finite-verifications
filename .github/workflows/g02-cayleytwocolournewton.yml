name: G02 CayleyTwoColourNewton Lean
on:
  pull_request:
    paths:
      - 'research/correspondants_20261013/lean/**'
      - '.github/workflows/g02-cayleytwocolournewton.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/correspondants_20261013/lean
          build: true
          use-mathlib-cache: true
      - name: Proof source and import check
        working-directory: research/correspondants_20261013/lean
        run: |
          echo "checkout=$(git rev-parse HEAD)"
          if grep -nE '(^|[[:space:]])sorry([[:space:]]|$)|sorryAx' CayleyTwoColourNewton.lean; then exit 1; fi
          printf 'import CayleyTwoColourNewton\n' > G02ImportCheck.lean
          lake env lean G02ImportCheck.lean
