name: interia-sa02-sa03-classical-gates

on:
  push:
    branches:
      - research/liouville-audit-2026-10-08
    paths:
      - "research/experiments/interia_sa02_weyl_certifier.py"
      - "research/experiments/test_interia_sa02_weyl_certifier.py"
      - "research/experiments/interia_sa03_trace.py"
      - "research/experiments/test_interia_sa03_trace.py"
      - "research/INTERIA_SA_02_PROTOCOL.md"
      - "research/INTERIA_SA_03_PROTOCOL.md"
      - ".github/workflows/interia-sa02.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify classical templates and adversarial dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/experiments -p 'test_interia_sa02_weyl_certifier.py' -v
          python3 -m unittest discover -s research/experiments -p 'test_interia_sa03_trace.py' -v
          python3 research/experiments/interia_sa03_trace.py --all --out /tmp/sa03.json
          python3 research/experiments/interia_sa03_trace.py --verify /tmp/sa03.json
          python3 -c 'import json; x=json.load(open("/tmp/sa03.json")); assert len(x["certificates"]) == 13'
          python3 research/experiments/interia_sa02_weyl_certifier.py --model bessel_weight_x --parameter 1 --claim LP LP >/dev/null
          if python3 research/experiments/interia_sa02_weyl_certifier.py --model bessel_weight_x --parameter 1 --claim LC LP >/dev/null; then
            echo "ERROR: bad Bessel threshold claim accepted"
            exit 1
          fi
