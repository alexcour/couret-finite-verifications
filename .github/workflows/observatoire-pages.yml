name: Observatoire - publication statique MOD30

on:
  push:
    branches: [main]
    paths:
      - research/mod30-permutations/**
      - .github/workflows/observatoire-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mod30-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate public-only mathematical content
        run: python -m unittest discover -s research/mod30-permutations -p "test_*.py" -v
      - name: Assemble explicit public allowlist only
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path("research/mod30-permutations")
          target = Path("_public_site")
          target.mkdir(exist_ok=True)
          for filename in ("index.html", "journal.html", "journal.json"):
              shutil.copyfile(source / filename, target / filename)
          (target / ".nojekyll").write_text("")
          assert sorted(p.name for p in target.iterdir()) == [".nojekyll", "index.html", "journal.html", "journal.json"]
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload approved static files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed content to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
