name: RECOH rank-one Lean candidate
on:
  push:
    branches: [research/recoh-rank-one-lean-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Reject proof gaps
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' research/strobo-2tors-2026-10-12/lean/RecohRankOne.lean; then exit 1; fi
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile existing bridge and rank-one lemma
        working-directory: research/strobo-2tors-2026-10-12/lean
        run: |
          set -euo pipefail
          lake resolve-deps
          lake exe cache get
          lake build RecohPivotCollision
          lake env lean RecohRankOne.lean
