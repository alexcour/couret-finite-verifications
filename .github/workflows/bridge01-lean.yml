name: bridge01-lean

on:
  push:
    branches:
      - research/couret-oai-bridge-01
    paths:
      - "research/lean/**"
      - ".github/workflows/bridge01-lean.yml"
      - "scripts/verify_stat_trans_bindings.py"
      - "research/STAT_TRANS_09_ARTIFACT_BINDINGS.json"
      - "research/STAT_TRANS_10_MUTATION_ORACLES.json"
      - "scripts/test_stat_trans_mutations.py"
      - "scripts/verify_stat_trans_freshness.py"
      - "scripts/gate_stat_trans_admission.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: research/lean
          build: true
          test: false
          lint: false
          auto-config: false
      - name: Verify status artifact bindings
        shell: bash
        run: |
          python3 scripts/verify_stat_trans_bindings.py
          python3 scripts/test_stat_trans_mutations.py
          python3 scripts/verify_stat_trans_freshness.py --self-test
      - name: Clean A0–A2+B0–B2 build and transitive axiom audit
        shell: bash
        run: |
          set -euo pipefail
          bash research/lean/verify_bridge01.sh | tee "$RUNNER_TEMP/bridge01-build-and-axioms.log"
      - name: Attest local versioned bridge after clean Lean and axiom audit
        shell: bash
        run: python3 scripts/verify_stat_trans_freshness.py --attest "$RUNNER_TEMP/stat-trans-witness.json"
      - name: Test fail-closed admission and consume same-run witness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_stat_trans_admission.py --self-test
          python3 scripts/gate_stat_trans_admission.py \
            --witness "$RUNNER_TEMP/stat-trans-witness.json" \
            --decision "$RUNNER_TEMP/stat-trans-admission.json"
      - name: Preserve witnessed admission decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stat-trans-admission-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stat-trans-witness.json
            ${{ runner.temp }}/stat-trans-admission.json
          if-no-files-found: error
          retention-days: 90
