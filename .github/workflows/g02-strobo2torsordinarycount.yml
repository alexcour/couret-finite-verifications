name: G02 Strobo2TorsOrdinaryCount Lean
on:
  pull_request:
    paths:
      - 'research/strobo-2tors-2026-10-12/lean/**'
      - '.github/workflows/g02-strobo2torsordinarycount.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/strobo-2tors-2026-10-12/lean
          build: true
          use-mathlib-cache: true
      - name: Source and import check
        working-directory: research/strobo-2tors-2026-10-12/lean
        run: |
          echo "checkout=$(git rev-parse HEAD)"
          if grep -nE '(^|[[:space:]])sorry([[:space:]]|$)|sorryAx' Strobo2TorsOrdinaryCount.lean; then exit 1; fi
          printf 'import Strobo2TorsOrdinaryCount\n' > G02ImportCheck.lean
          lake env lean G02ImportCheck.lean
