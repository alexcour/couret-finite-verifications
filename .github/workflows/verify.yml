name: verify
on: [push, pull_request, workflow_dispatch]

jobs:
  public-verifiers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run all public verifiers
        run: bash VERIFY_LOCAL.sh
      - name: Review packet stdlib arithmetic and archive consistency only
        run: python research/audits/liouville_grothendieck_20261008/REVIEW_SELF_CHECK.py
      - name: CU-BRUIT B1 exact Fourier and prime-square sanity (not spectral proof)
        run: python research/audits/liouville_grothendieck_20261008/gate_b1_independent_check_20261010.py
      - name: CU-BRUIT A3 pending-source status must remain 0/37
        run: |
          python research/audits/liouville_grothendieck_20261008/gate_q15_external_compare_20261010.py --out /tmp/cu_bruit_a3_pending.json
          python -c "import json; d=json.load(open('/tmp/cu_bruit_a3_pending.json')); assert d['q15_external_decimal_matches']==0 and d['status']=='NO_EXTERNAL_SOURCE_37_PENDING' and d['completeness_proved_by_this_script'] is False"
      - name: Generated results are stable
        run: git diff --exit-code -- 03-consecutive-squares/results.csv

  release-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Reject private paths in current tree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(06-registry|hol01[^/]*|OPEN_ANTERIORITY[^/]*|PRIVATE_DO_NOT_PUBLISH)(/|$)' ; then
            echo "::error::Private or withheld path detected in the public repository"
            exit 1
          fi
      - name: Reject private paths in reachable history
        shell: bash
        run: |
          set -euo pipefail
          if git log --all --name-only --pretty=format: | grep -E '(^|/)(06-registry|hol01[^/]*|OPEN_ANTERIORITY[^/]*|PRIVATE_DO_NOT_PUBLISH)(/|$)' ; then
            echo "::error::A withheld path exists in Git history. Rebuild from a fresh git init."
            exit 1
          fi
      - name: Validate JSON metadata
        run: python -m json.tool .zenodo.json >/dev/null
