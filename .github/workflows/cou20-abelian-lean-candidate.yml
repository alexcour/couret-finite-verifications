name: cou20-abelian-lean-candidate

on:
  push:
    branches: [research/cou-20-abelian-two-colour-20261015]
  pull_request:
    paths:
      - 'research/correspondants_20261013/lean/**'
      - '.github/workflows/cou20-abelian-lean-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abelian-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject incomplete proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' research/correspondants_20261013/lean/CayleyTwoColourAbelian.lean research/correspondants_20261013/lean/CayleyTwoColourSpectral.lean; then
            exit 1
          fi
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check bridge and dependencies
        working-directory: research/correspondants_20261013/lean
        shell: bash
        run: |
          set -euo pipefail
          lake resolve-deps
          lake exe cache get
          lean --version
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/CayleyDoubletCore.olean CayleyDoubletCore.lean
          lake env lean -o .lake/build/lib/lean/CayleyTwoColourFamily.olean CayleyTwoColourFamily.lean
          lake env lean -o .lake/build/lib/lean/CayleyTwoColourAbelian.olean CayleyTwoColourAbelian.lean
          lake env lean CayleyTwoColourSpectral.lean

