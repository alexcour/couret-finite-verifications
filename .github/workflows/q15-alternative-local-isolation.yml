name: q15-alternative-local-isolation
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  alternative-local-witnesses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned python-flint native backend
        run: python -m pip install python-flint==0.9.0
      - name: Alternative local root witnesses without Hardy Z or derivative jets
        run: python research/audits/liouville_grothendieck_20261008/check_q15_local_isolation_alternative.py --precision 256
