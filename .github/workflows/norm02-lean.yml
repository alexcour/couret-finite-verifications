name: norm02-lean-proof-check
on:
  push:
    branches:
      - research/couret-norm02-lean-2026-10-09
    paths:
      - "research/lean/CouretOaiBridge01/NORM02_FiniteArithmetic.lean"
      - "research/lean/NORM02_Axioms.lean"
      - ".github/workflows/norm02-lean.yml"
  workflow_dispatch:

jobs:
  norm02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean
          build: true
          test: false
          lint: false
          auto-config: true
      - name: Elaborate and inspect NORM-02 axioms
        working-directory: research/lean
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake --wfail build CouretOaiBridge01.NORM02_FiniteArithmetic
          lake env lean CouretOaiBridge01/NORM02_FiniteArithmetic.lean
          lake env lean NORM02_Axioms.lean | tee "$RUNNER_TEMP/norm02-axioms.log"
          if grep -Eq 'sorryAx|unknown constant|declaration uses .+axiom' "$RUNNER_TEMP/norm02-axioms.log"; then
            echo "::error::Untrusted axiom or sorry in NORM02"
            exit 1
          fi
      - name: Reject placeholders and custom axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' research/lean/CouretOaiBridge01/NORM02_FiniteArithmetic.lean; then
            exit 1
          fi
