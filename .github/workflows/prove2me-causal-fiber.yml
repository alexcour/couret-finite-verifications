name: Prove2Me CAUSAL-FIBER-01 exact import
on:
  push:
    branches: [prove2me/causal-fiber-20261110]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Lean toolchain manager
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source, extract declarations, audit axioms and compare types
        run: python prepare_causal_fiber.py
      - name: Preserve source and generated validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prove2me-causal-fiber-validated
          path: |
            source-evidence/
            generated/Definitions/
            generated/Theorems/
            generated/Solutions/
            generated/plan.json
            generated/axioms.json
            generated/validation/
          retention-days: 30
