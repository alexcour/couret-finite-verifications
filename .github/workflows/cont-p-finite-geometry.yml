name: CONT-P synthetic gain geometry
on:
  push:
    paths:
      - 'research/cont-p/**'
      - '.github/workflows/cont-p-finite-geometry.yml'
  pull_request:
    paths:
      - 'research/cont-p/**'
      - '.github/workflows/cont-p-finite-geometry.yml'
  workflow_dispatch:

jobs:
  exact-synthetic-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify committed research files
        working-directory: research/cont-p/v1.12.0
        run: sha256sum -c SHA256SUMS.txt
      - name: Check exact finite geometry on synthetic inputs
        working-directory: research/cont-p/v1.12.0
        run: python3 verify_gain_geometry.py
