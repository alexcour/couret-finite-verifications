name: G02 Cayley abelian Lean split
on:
  pull_request:
    paths:
      - 'research/correspondants_20261013/lean/**'
      - '.github/workflows/g02-cayley-abelian-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/correspondants_20261013/lean
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/correspondants_20261013/lean
          build: true
          use-mathlib-cache: true
      - name: Verify proof axioms (no sorryAx)
        run: |
          printf 'import CayleyTwoColourAbelian\n#print axioms Couret.CayleyDoublet.abelianThree_iso_iff_nongeneration\n' > G02AxiomCheck.lean
          lake env lean G02AxiomCheck.lean > G02AxiomCheck.log
          cat G02AxiomCheck.log
          if grep -q 'sorryAx' G02AxiomCheck.log; then exit 1; fi
