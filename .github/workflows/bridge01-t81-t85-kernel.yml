name: bridge01-t81-t85-kernel

on:
  push:
    branches:
      - research/couret-oai-bridge-01
    paths:
      - "research/COURET_OAI_BRIDGE_01_T81_T85.md"
      - "research/experiments/verify_kernel.py"
      - "research/experiments/bridge_exp05_spectral_null.py"
      - ".github/workflows/bridge01-t81-t85-kernel.yml"
  workflow_dispatch:

jobs:
  kernel-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run T81-T85 exact kernel checks
        working-directory: research/experiments
        run: |
          python verify_kernel.py | tee t81_t85_stdout.txt
      - name: Validate machine result
        working-directory: research/experiments
        run: |
          python -m json.tool T81_T85_exact_checks.json >/dev/null
          grep -F "All checks PASS" t81_t85_stdout.txt
      - name: Record hashes
        working-directory: research/experiments
        run: |
          sha256sum verify_kernel.py T81_T85_exact_checks.json
