name: RECOH Unified Port Exact-SHA CI
on:
  push:
    branches:
      - research/recoh-unified-port-2026-11-08
      - research/recoh-conditional-lean-repro-2026-10-30
      - main
    paths:
      - 'research/strobo-2tors-2026-10-12/lean/**'
      - '.github/workflows/recoh-unified-port.yml'
  pull_request:
    paths:
      - 'research/strobo-2tors-2026-10-12/lean/**'
      - '.github/workflows/recoh-unified-port.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recoh-unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '2'
      SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: research/strobo-2tors-2026-10-12/lean
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test transport failures without network
        run: python3 -m unittest -v test_recoh_ci_bootstrap
      - name: Install and validate pinned Lean archive
        run: python3 recoh_ci_bootstrap.py toolchain
      - name: Resolve pinned dependencies and validate cache tools
        run: python3 recoh_ci_bootstrap.py cache
      - name: Build 37 modules, audit 23 roots and reject false budget
        run: python3 recoh_unified_ci.py
