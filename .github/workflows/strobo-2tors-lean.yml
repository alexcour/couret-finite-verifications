name: strobo-2tors-lean
on:
  push:
    branches:
      - research/strobo-2tors-global-classification-2026-10-12
  pull_request:
    paths:
      - "research/strobo-2tors-2026-10-12/**"
      - ".github/workflows/strobo-2tors-lean.yml"
  workflow_dispatch:

jobs:
  core-and-exact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Replay exact triple-square tests
        run: |
          python research/strobo-2tors-2026-10-12/verify_strobo_2tors.py
          python research/strobo-2tors-2026-10-12/verify_remaining_profiles_20261013.py
          python research/strobo-2tors-2026-10-12/audit_zero_free_histogram_20261014.py
          git diff --exit-code -- research/strobo-2tors-2026-10-12/remaining_profiles_results_20261013.json
      - name: Reject placeholders and custom axioms in proof modules
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' research/strobo-2tors-2026-10-12/lean/Strobo2Tors{Core,Cardinality,Enumeration,ZeroFree,ZeroFreeAll,SurvivalCounts,OrdinaryProfiles,ProfilePartition}.lean; then
            echo "::error::Proof placeholder or axiom found"
            exit 1
          fi
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lean and mathlib
        working-directory: research/strobo-2tors-2026-10-12/lean
        run: |
          lake resolve-deps
          lake exe cache get
          lean --version
      - name: Compile classification and fibre counts with and without zero
        working-directory: research/strobo-2tors-2026-10-12/lean
        run: lake build
