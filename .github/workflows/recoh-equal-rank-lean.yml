name: RECOH equal-rank Lean candidate
on:
  push:
    branches: [research/recoh-equal-rank-info-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equal-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Reject proof placeholders
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' research/strobo-2tors-2026-10-12/lean/RecohEqualRank.lean; then exit 1; fi
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dependencies and equal-rank lemma
        working-directory: research/strobo-2tors-2026-10-12/lean
        run: |
          set -euo pipefail
          lake resolve-deps
          lake exe cache get
          lake build RecohBinaryDichotomy
          lake env lean RecohEqualRank.lean
