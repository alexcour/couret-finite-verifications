name: g30-gate-b-lean
on:
  push:
    branches:
      - research/g30-gate-b-lean
  pull_request:
    paths:
      - "research/g30-gate-b-lean/**"
      - ".github/workflows/g30-gate-b-lean.yml"
  workflow_dispatch:

jobs:
  gate-b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Replay exact Python classification
        run: python research/g30-gate-b-lean/verify_g30_gate_b.py

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Lean and Mathlib
        working-directory: research/g30-gate-b-lean
        run: |
          lake update
          lean --version
          lake --version

      - name: Compile G30 complex spectrum certificate
        working-directory: research/g30-gate-b-lean
        run: |
          lake env lean G30ComplexSpectrum.lean

      - name: Reject sorry/admit in certificate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit)\b' research/g30-gate-b-lean/G30ComplexSpectrum.lean; then
            echo "::error::Unresolved proof placeholder found"
            exit 1
          fi
