name: Prove2Me exact extended corpus validation
on:
  push:
    branches: [prove2me/extended-final-20261108]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Recover checked source text and compiled source cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42506536317 --repo alexcour/couret-finite-verifications --name prove2me-extension-source-checks --dir recovered
      - name: Install official Lean toolchain manager
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Repair proof bodies by Lean spans and compare exact original types
        run: python repair_and_prepare_extended.py
      - name: Preserve generated tree for mathematical readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prove2me-extended-draft
          path: |
            unified-evidence/
            generated/Definitions/
            generated/Theorems/
            generated/Solutions/
            generated/plan.json
            generated/axioms.json
          retention-days: 30
      - name: Validate exact upload text and all solution signatures
        run: |
          python validate_platform.py project generated generated/validation
          python -c "import json; assert json.load(open('generated/validation/platform-validation.json'))['status']=='PASS'"
      - name: Preserve final validation and recovery cache
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prove2me-extended-validated
          path: |
            unified-evidence/
            project/.lake/build/
            generated/Definitions/
            generated/Theorems/
            generated/Solutions/
            generated/plan.json
            generated/axioms.json
            generated/validation/
            generated/.lake/build/
          retention-days: 30
          include-hidden-files: true
