    "name": "Directed Cayley non-isomorphism and abelian generation dichotomy",
    "description": "For exceptional three-increment directed Cayley graphs in an abelian group, under the displayed torsion, nondegeneracy and generation assumptions, the reflected pair is isomorphic exactly when the singleton and half-turn increments do not generate the ambient group. A separate theorem proves non-isomorphism for two explicit three-increment digraphs on Z/(12r)Z for every positive natural r, with no affine restriction on vertex equivalences. These are adaptations of prior public Couret formalizations; mathematical novelty and independent human review are not established.",
