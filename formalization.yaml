    "name": "Conditional masked-probe collisions for additive reconstruction",
    "description": "In an abelian group with a nonzero element v of order three and a nonzero element d annihilated by doubling, the supports {0,v,v+d} and {0,-v,-v+d} are distinct and have equal full labelled ordered additive convolution squares. Any finite list of multiplicative probes satisfying, for each probe chi, chi(d)=-1 or chi(v)=chi(-v), also has equal triple-probe sums on these supports. The masking condition is a hypothesis: no existence theorem or general lower bound on the number of probes is claimed. This adapts a prior public Couret formalization; novelty and independent human review are not established.",
