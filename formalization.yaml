    "name": "Exact finite Gaussian-character signatures on U(30)",
    "description": "The explicit eight-character table for C2 x C4 assigns Gaussian-integer sums to all 56 three-element subsets. For the stated table, exact list computations certify ten distinct signature classes with sizes 8,5,4,4,4,4,8,8,8,3, two squared-magnitude classes of sizes 32 and 24, a five-member distinguished fibre and five explicit adjacency-permutation checks. The submitted statements concern these fixed definitions and finite checks; no separate abstract adjacency-eigenvalue theorem, asymptotic arithmetic result or mathematical novelty is claimed. Proofs are being migrated from native evaluation to kernel checking.",
