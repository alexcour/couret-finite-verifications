    "name": "Sharp six-letter saturation threshold modulo 30",
    "description": "For words in the unit-residue code modulo 30, six or more letters make full and proper subsequence-product supports coincide. The explicit five-letter code word (0,1),(0,1),(0,1),(1,0),(1,1) has full support but misses the identity in proper support. A separate checked arithmetic witness is the prime word 7,7,7,11,17, of product 64141; Solution proves that encoding this arithmetic word gives the displayed code word. These are finite-group support statements, with no general integer-factorization or prime-distribution claim.",
